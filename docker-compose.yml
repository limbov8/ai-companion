services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_companion_db
    environment:
      POSTGRES_USER: ai_companion
      POSTGRES_PASSWORD: ai_companion
      POSTGRES_DB: ai_companion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_companion -d ai_companion"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://ai_companion:ai_companion@db:5432/ai_companion
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models

volumes:
  pgdata:
