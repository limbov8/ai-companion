[project]
name = "ai-companion"
version = "0.1.0"
description = "Personal AI companion monolith with voice, memory, tools, and prompt registry."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
local-models = [
  "torch>=2.3",
  "transformers>=4.43",
  "accelerate>=0.33",
  "sentence-transformers>=3.0",
  "soundfile>=0.12",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
