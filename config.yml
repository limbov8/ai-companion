deepseek:
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  thinking: enabled
  reasoning_effort: medium
  models:
    conversation: deepseek-v4-pro
    other: deepseek-v4-flash

server:
  host: 0.0.0.0
  port: 8080
  public_url: http://localhost:8080

database:
  dsn_env: DATABASE_URL
  default_dsn: postgresql+psycopg://ai_companion:ai_companion@localhost:5433/ai_companion

models:
  asr:
    provider: local
    model_id: openai/whisper-large-v3
    device: cuda
  embedding:
    provider: local
    model_id: Qwen/Qwen3-Embedding-0.6B
    device: cuda
  tts:
    provider: local
    model_id: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
    device: cuda
    lazy_load: true
    language: English
    speaker: Ryan
    instruct: Natural, warm, conversational speech.

memory:
  top_k: 8
  rerank_top_k: 4
  similarity_floor: 0.25

conversation:
  proactive_topic_interval_minutes: 45
  allow_random_topics: true
