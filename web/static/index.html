<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Companion</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="talk-surface">
        <header class="topbar">
          <div>
            <h1>AI Companion</h1>
            <p id="status">Ready</p>
          </div>
        </header>

        <section class="voice-stage" aria-live="polite">
          <button id="micButton" class="voice-button" title="Start or finish talking">
            <span id="micIcon">Mic</span>
          </button>
          <p id="phaseText">Tap Mic, speak naturally, then tap Done.</p>
          <button id="stopButton" class="stop-button" title="Barge in and stop playback">Stop</button>
        </section>

        <section id="conversation" class="conversation" aria-live="polite"></section>
      </section>
    </main>
    <script src="/static/app.js" type="module"></script>
  </body>
</html>
