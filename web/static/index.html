<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Companion</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="talk-surface">
        <aside class="conversation-list-surface" aria-label="Saved conversations">
          <div class="history-header">
            <h2>Sessions</h2>
            <button id="newConversationButton" class="icon-button" title="Start new conversation">New</button>
          </div>
          <section id="conversationList" class="conversation-list" aria-live="polite"></section>
        </aside>

        <header class="topbar">
          <div>
            <h1>AI Companion</h1>
            <p id="status">Ready</p>
          </div>
        </header>

        <section class="voice-stage" aria-live="polite">
          <button id="micButton" class="voice-button" title="Start or finish talking">
            <span id="micIcon">Mic</span>
          </button>
          <div id="voiceMeter" class="voice-meter" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <p id="phaseText">Tap Mic, speak naturally, then pause to send.</p>
          <button id="stopButton" class="stop-button" title="Barge in and stop playback">Stop</button>
          <audio id="speakerOutput" preload="auto" playsinline></audio>
        </section>

        <section class="history-surface" aria-label="Conversation history">
          <div class="history-header">
            <h2>Conversation</h2>
            <p id="historyCount">0 turns</p>
          </div>
          <section id="conversation" class="conversation" aria-live="polite"></section>
        </section>

        <aside class="memory-surface" aria-label="Memory activity">
          <div class="history-header">
            <h2>Memory</h2>
            <p id="memoryCount">No memory yet</p>
          </div>
          <section id="memoryActivity" class="memory-activity" aria-live="polite"></section>
        </aside>
      </section>
    </main>
    <script src="/static/app.js" type="module"></script>
  </body>
</html>
